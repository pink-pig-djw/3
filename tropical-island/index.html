<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小岛时光</title>
<meta name="description" content="一座可以环绕、跟随、巡游的热带小岛微缩模型：一天的光影循环、下雨、移轴摄影与环境音。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* Layout: a full-bleed WebGL diorama; the UI floats over it as warm, tinted glass —
   a title card top-left, quick actions top-right, and one control dock along the bottom edge. */
:root {
  --night: #0f1b22;                      /* page ground behind the canvas */
  --glass: rgba(17, 30, 34, 0.50);       /* panel tint */
  --glass-strong: rgba(13, 24, 28, 0.78);
  --rim: rgba(255, 236, 214, 0.14);      /* hairline borders */
  --ink: #fff5e8;                        /* warm white text */
  --ink-dim: rgba(255, 238, 220, 0.66);
  --sun: #ffc66d;                        /* accent: late-afternoon sunlight */
  --sun-ink: #2b1d0b;                    /* text on the accent */
  --lagoon: #7fe3d6;                     /* secondary accent: shallow water */
  --font-display: "Fraunces", "Noto Serif SC", Georgia, "Times New Roman", serif;
  --font-cn: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --r-panel: 20px;
  --r-pill: 999px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
[hidden] { display: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* ---------- glass ---------- */
.glass {
  background: var(--glass);
  border: 1px solid var(--rim);
  backdrop-filter: blur(16px) saturate(1.35);
  -webkit-backdrop-filter: blur(16px) saturate(1.35);
  box-shadow: 0 12px 40px rgba(6, 12, 14, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.hud { transition: opacity .5s ease, transform .5s ease; }
#app.ui-hidden .hud { opacity: 0; pointer-events: none; transform: translateY(6px); }

/* ---------- top ---------- */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 0;
}
.brand { pointer-events: auto; padding: 14px 18px 14px; border-radius: var(--r-panel); min-width: 0; }
.eyebrow {
  font-family: var(--font-display); font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-dim); white-space: nowrap;
}
.brand h1 {
  margin: 4px 0 6px; font-family: var(--font-cn); font-weight: 600; font-size: 28px; line-height: 1.15;
  letter-spacing: .08em; text-wrap: balance; text-shadow: 0 2px 18px rgba(255, 190, 110, 0.25);
}
.clock { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
.clock .t { font-family: var(--font-display); font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.clock svg { width: 18px; height: 18px; color: var(--sun); flex: none; }
.clock .wx { color: var(--lagoon); }
.actions { pointer-events: auto; display: flex; gap: 8px; padding: 6px; border-radius: var(--r-pill); }

/* ---------- buttons ---------- */
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: var(--r-pill); display: grid; place-items: center;
  color: var(--ink); transition: background .2s ease, color .2s ease, transform .15s ease;
}
.icon-btn:hover { background: rgba(255, 240, 220, 0.12); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); }
.icon-btn .off { display: none; }
.icon-btn[aria-pressed="false"] .on { display: none; }
.icon-btn[aria-pressed="false"] .off { display: block; }

/* ---------- dock ---------- */
.dock {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(800px, calc(100% - 32px)); border-radius: 24px; padding: 10px 12px;
  display: grid; gap: 8px;
}
#app.ui-hidden .dock { transform: translateX(-50%) translateY(8px); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.chips { display: flex; gap: 4px; flex: none; }
.chip {
  padding: 7px 12px; border-radius: var(--r-pill); font-size: 13px; color: var(--ink-dim); white-space: nowrap;
  transition: background .25s ease, color .25s ease;
}
.chip:hover { color: var(--ink); background: rgba(255, 240, 220, 0.10); }
.chip.active { background: var(--sun); color: var(--sun-ink); font-weight: 600; }

.slider-wrap { position: relative; flex: 1; min-width: 120px; height: 30px; display: flex; align-items: center; }
#timeSlider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 99px; margin: 0; cursor: pointer; background: #345; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
#timeSlider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--ink);
  box-shadow: 0 0 0 4px rgba(255, 198, 109, 0.35), 0 2px 8px rgba(0,0,0,0.35);
}
#timeSlider::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px rgba(255, 198, 109, 0.35); }
.ticks { position: absolute; left: 10px; right: 10px; top: 24px; display: flex; justify-content: space-between; font-size: 9px; color: var(--ink-dim); font-variant-numeric: tabular-nums; pointer-events: none; opacity: .75; }

.toggle {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-pill);
  color: var(--ink); background: rgba(255, 240, 220, 0.07); white-space: nowrap;
  transition: background .25s ease, color .25s ease;
}
.toggle svg { width: 17px; height: 17px; }
.toggle:hover { background: rgba(255, 240, 220, 0.14); }
.toggle[aria-pressed="true"] { background: var(--lagoon); color: #08302b; font-weight: 600; }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: rgba(0, 0, 0, 0.22); }
.seg button { position: relative; z-index: 1; padding: 6px 14px; border-radius: var(--r-pill); color: var(--ink-dim); white-space: nowrap; transition: color .25s ease; }
.seg button.active { color: var(--sun-ink); font-weight: 600; }
.seg .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; border-radius: var(--r-pill); background: var(--sun); transition: left .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1); }
.spacer { flex: 1; }
.cam-label { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }

/* ---------- settings ---------- */
.panel {
  position: fixed; z-index: 6; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 132px);
  width: min(300px, calc(100% - 32px)); border-radius: var(--r-panel); padding: 16px 16px 12px;
  background: var(--glass-strong);
}
.panel h2 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .04em; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 7px 0; border-top: 1px solid var(--rim); }
.field label { font-size: 13px; }
.field output { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--sun); margin: 2px 0 0; }
.field .seg { justify-self: end; }
.field .seg button { padding: 4px 10px; font-size: 12px; }
.switch { justify-self: end; width: 40px; height: 22px; border-radius: 99px; background: rgba(255,255,255,0.18); position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--sun); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--sun-ink); }
.keys { margin: 10px 0 0; font-size: 11px; line-height: 1.7; color: var(--ink-dim); }
.keys kbd { font-family: var(--font-ui); font-size: 10px; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--rim); background: rgba(255,255,255,0.06); color: var(--ink); }

/* ---------- small tags ---------- */
.follow-tag {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 18px); padding: 8px 16px; border-radius: var(--r-pill);
  font-size: 13px; color: var(--ink-dim); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
.follow-tag b { color: var(--ink); font-weight: 600; }
.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 136px); font-size: 12px; color: var(--ink);
  padding: 6px 14px; border-radius: var(--r-pill); background: rgba(10, 20, 24, 0.38); white-space: nowrap;
  transition: opacity 1.2s ease; pointer-events: none;
}
.hint.fade { opacity: 0; }
.unhide {
  position: fixed; z-index: 7; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  opacity: 0; pointer-events: none; transition: opacity .4s ease;
}
#app.ui-hidden .unhide { opacity: .55; pointer-events: auto; }
#app.ui-hidden .unhide:hover { opacity: 1; }

/* ---------- loader ---------- */
#loader {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 50% 100%, #f6c38f 0%, #c98a86 28%, #5d5f8a 62%, #1d2a44 100%);
  transition: opacity 1.4s ease, visibility 1.4s;
}
#loader.done { opacity: 0; visibility: hidden; }
.loader-inner { text-align: center; padding: 0 24px; }
.loader-title { font-family: var(--font-cn); font-weight: 600; font-size: 40px; letter-spacing: .14em; color: #fff7ec; text-shadow: 0 4px 30px rgba(255, 200, 140, 0.45); }
.loader-sub { margin-top: 10px; font-family: var(--font-display); font-style: italic; font-size: 14px; color: rgba(255, 244, 230, 0.8); min-height: 1.4em; }
.loader-bar { margin: 18px auto 0; width: 180px; height: 3px; border-radius: 99px; background: rgba(255,255,255,0.22); overflow: hidden; }
.loader-bar i { display: block; height: 100%; width: 0%; background: #fff2dc; border-radius: inherit; transition: width .3s ease; }
.loader-wave { margin: 22px auto 0; width: 120px; height: 14px; color: rgba(255, 246, 232, 0.7); }
.err { margin-top: 14px; font-size: 13px; color: #fff; max-width: 420px; line-height: 1.6; }

/* ---------- narrow screens ---------- */
@media (max-width: 720px) {
  .dock { padding: 10px; border-radius: 20px; }
  .row { flex-wrap: wrap; }
  .chips { order: 3; flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; justify-content: space-between; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { padding: 6px 10px; }
  .slider-wrap { flex: 1 1 auto; }
  .cam-label { display: none; }
  .brand { padding: 10px 14px; }
  .brand h1 { font-size: 22px; margin: 2px 0 4px; }
  .eyebrow { font-size: 10px; letter-spacing: .16em; }
  .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 176px); }
  .panel { bottom: calc(env(safe-area-inset-bottom, 0px) + 176px); }
  .actions { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  .hud, .chip, .seg .pill, #loader { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" tabindex="0" aria-label="热带小岛微缩模型，可拖动旋转"></canvas>

  <div id="loader" role="status" aria-live="polite">
    <div class="loader-inner">
      <div class="loader-title">小岛时光</div>
      <div class="loader-sub" id="loaderText">正在铺沙滩…</div>
      <div class="loader-bar"><i id="loaderBar"></i></div>
      <svg class="loader-wave" viewBox="0 0 120 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M2 7c8 0 8-5 16-5s8 5 16 5 8-5 16-5 8 5 16 5 8-5 16-5 8 5 16 5 8-5 16-5"><animateTransform attributeName="transform" type="translate" values="0 0;-32 0" dur="1.6s" repeatCount="indefinite"/></path>
      </svg>
      <div class="err" id="loaderErr" hidden></div>
    </div>
  </div>

  <header class="top">
    <div class="brand glass hud">
      <div class="eyebrow">Tropical Diorama · Scale 1:160</div>
      <h1>小岛时光</h1>
      <div class="clock">
        <span id="clockIcon" aria-hidden="true"></span>
        <span class="t" id="clockTime">17:20</span>
        <span id="clockLabel">黄金时刻</span>
        <span class="wx" id="weatherLabel"></span>
      </div>
    </div>
    <div class="actions glass hud">
      <button class="icon-btn" id="btnSound" aria-pressed="false" title="环境音效（M）" aria-label="环境音效">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.5a8 8 0 0 1 0 11"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button class="icon-btn" id="btnHide" title="隐藏界面（H）" aria-label="隐藏界面">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
      </button>
      <button class="icon-btn" id="btnFull" title="全屏（F）" aria-label="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="follow-tag glass hud" id="followTag" hidden>正在跟随　<b id="followName">—</b></div>

  <div class="dock glass hud" id="dock">
    <div class="row">
      <button class="icon-btn" id="btnPlay" aria-pressed="true" title="时间流逝（空格）" aria-label="时间流逝">
        <svg class="on" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10-6.8a1 1 0 0 0 0-1.6l-10-6.8C8.9 3.9 8 4.4 8 5.2z"/></svg>
      </button>
      <div class="chips" role="group" aria-label="时间">
        <button class="chip" data-hour="6.7">清晨</button>
        <button class="chip" data-hour="12.2">中午</button>
        <button class="chip" data-hour="17.35">黄金时刻</button>
        <button class="chip" data-hour="18.55">日落</button>
        <button class="chip" data-hour="21.6">夜晚</button>
      </div>
      <div class="slider-wrap">
        <input type="range" id="timeSlider" min="0" max="24" step="0.01" value="17.3" aria-label="一天中的时间">
        <div class="ticks" aria-hidden="true"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
      </div>
    </div>
    <div class="row">
      <button class="toggle" id="btnRain" aria-pressed="false" title="下雨（R）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.6 9 3.3 3.3 0 0 1 18 15.5z"/><path d="M8.5 18.5l-1 2M12.5 18.5l-1 2M16.5 18.5l-1 2"/></svg>
        <span id="rainLabel">下雨</span>
      </button>
      <span class="spacer"></span>
      <span class="cam-label">相机</span>
      <div class="seg" id="camSeg" role="group" aria-label="相机模式">
        <span class="pill"></span>
        <button data-cam="orbit" class="active" title="自由环绕（1）">环绕</button>
        <button data-cam="follow" title="跟随（2）">跟随</button>
        <button data-cam="tour" title="自动巡游（3）">巡游</button>
      </div>
      <button class="toggle" id="btnNext" title="换一个跟随对象（N）" hidden>换一个</button>
      <button class="icon-btn" id="btnSettings" aria-pressed="false" title="画面与声音设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </div>

  <div class="panel glass hud" id="settings" hidden>
    <h2>镜头与氛围</h2>
    <div class="field"><label for="sTilt">移轴模糊</label><output id="oTilt">100%</output><input type="range" id="sTilt" min="0" max="2" step="0.05" value="1"></div>
    <div class="field"><label for="sBloom">柔光泛光</label><output id="oBloom">100%</output><input type="range" id="sBloom" min="0" max="2" step="0.05" value="1"></div>
    <div class="field"><label for="sSpeed">时间速度</label><output id="oSpeed">一天 8 分钟</output><input type="range" id="sSpeed" min="0" max="1" step="0.01" value="0.45"></div>
    <div class="field"><label for="sVol">音量</label><output id="oVol">70%</output><input type="range" id="sVol" min="0" max="1" step="0.01" value="0.7"></div>
    <div class="field"><label>画质</label>
      <div class="seg" id="qualSeg" role="group" aria-label="画质"><span class="pill"></span><button data-q="low">流畅</button><button data-q="medium">均衡</button><button data-q="high">精美</button></div>
    </div>
    <div class="field"><label id="lblSpin">环绕时自动缓转</label><button class="switch" id="swSpin" role="switch" aria-checked="true" aria-labelledby="lblSpin"></button></div>
    <p class="keys"><kbd>空格</kbd> 时间　<kbd>R</kbd> 下雨　<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 相机　<kbd>N</kbd> 换人　<kbd>M</kbd> 声音　<kbd>H</kbd> 隐藏界面</p>
  </div>

  <div class="hint hud" id="hint">拖动旋转 · 滚轮或双指缩放 · 右键平移</div>
  <button class="icon-btn unhide glass" id="btnUnhide" title="显示界面（H）" aria-label="显示界面">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
  </button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script>
  // Surface load failures (e.g. the CDN is unreachable) instead of leaving the loader spinning.
  window.__islandBoot = setTimeout(function () {
    var e = document.getElementById('loaderErr');
    if (e && !window.__islandStarted) { e.hidden = false; e.textContent = '三维引擎加载得有点慢……如果一直停在这里，请检查网络能否访问 cdn.jsdelivr.net 后刷新。'; }
  }, 15000);
  window.addEventListener('error', function (ev) {
    var e = document.getElementById('loaderErr');
    if (e && !window.__islandReady) { e.hidden = false; e.textContent = '加载出错：' + (ev.message || '未知错误'); }
  });
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// Tileable normal/noise texture for small water ripples (RG = slope, B = foam noise)
function buildWaterNormalTexture() {
  const N = 256, data = new Uint8Array(N * N * 4), r = mulberry32(77);
  const waves = [];
  for (let k = 0; k < 34; k++) {
    let kx = Math.round((r() * 2 - 1) * 11), ky = Math.round((r() * 2 - 1) * 11);
    if (kx === 0 && ky === 0) kx = 1;
    const len = Math.hypot(kx, ky);
    waves.push({ kx, ky, a: 1 / Math.pow(len, 1.25), ph: r() * TAU });
  }
  const foamW = [];
  for (let k = 0; k < 16; k++) { const kx = Math.round((r() * 2 - 1) * 6) || 2, ky = Math.round((r() * 2 - 1) * 6) || 1; foamW.push({ kx, ky, a: 1 / Math.hypot(kx, ky), ph: r() * TAU }); }
  const gx = new Float32Array(N * N), gy = new Float32Array(N * N), fn = new Float32Array(N * N);
  let mx = 0, fmin = 1e9, fmax = -1e9;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    let dx = 0, dy = 0, f = 0;
    for (const w of waves) { const ph = TAU * (w.kx * i + w.ky * j) / N + w.ph, c = Math.cos(ph) * w.a; dx += c * w.kx; dy += c * w.ky; }
    for (const w of foamW) f += Math.sin(TAU * (w.kx * i + w.ky * j) / N + w.ph) * w.a;
    const k = j * N + i; gx[k] = dx; gy[k] = dy; fn[k] = f;
    mx = Math.max(mx, Math.abs(dx), Math.abs(dy)); fmin = Math.min(fmin, f); fmax = Math.max(fmax, f);
  }
  for (let k = 0; k < N * N; k++) {
    data[k * 4] = clamp(128 + 127 * gx[k] / mx, 0, 255);
    data[k * 4 + 1] = clamp(128 + 127 * gy[k] / mx, 0, 255);
    data[k * 4 + 2] = 255 * (fn[k] - fmin) / (fmax - fmin);
    data[k * 4 + 3] = 255;

}

const WAVE_GLSL = /* glsl */`

  float s = 0.045*sin(dot(p, vec2(0.36, 0.21)) + t*1.15) + 0.032*sin(dot(p, vec2(-0.24, 0.44)) + t*1.55) + 0.018*sin(dot(p, vec2(0.62, -0.47)) + t*2.2);

function waveH(x, z, t) {
  const dk = smooth(-1.5, -7.0, hAt(x, z));
  const s = 0.045 * Math.sin(x * 0.36 + z * 0.21 + t * 1.15) + 0.032 * Math.sin(-x * 0.24 + z * 0.44 + t * 1.55) + 0.018 * Math.sin(x * 0.62 - z * 0.47 + t * 2.2);

function applyEnv(E, rainK) {

  dir.normalize();

//  Post-processing: bloom → tilt-shift → grade
// =====================================================================
const TiltShiftShader = {
  uniforms: { tDiffuse: { value: null }, tBloom: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uFocus: { value: 0.5 }, uBand: { value: 0.16 }, uBlur: { value: 10 }, uTilt: { value: 0 } },

  fragmentShader: '',

function tiltShader(taps) {

    uniform sampler2D tDiffuse; uniform sampler2D tBloom; uniform vec2 uRes; uniform float uFocus, uBand, uBlur, uTilt; varying vec2 vUv;
    float coc(vec2 uv){ float y = uv.y + (uv.x - 0.5) * uTilt; float d = abs(y - uFocus); return smoothstep(uBand * 0.5, uBand * 0.5 + 0.42, d); }
    void main(){
      float c = coc(vUv);
      float r = c * c * uBlur;
      vec3 bloom = texture2D(tBloom, vUv).rgb;
      if (any(isnan(bloom)) || any(isinf(bloom))) bloom = vec3(0.0);
      if (r < 0.35) { gl_FragColor = vec4(texture2D(tDiffuse, vUv).rgb + bloom, 1.0); return; }
      float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
      vec3 acc = vec3(0.0); float wsum = 0.0;
      for (int i = 0; i < ${taps}; i++) {
        float fi = float(i) + 0.5;
        float rr = sqrt(fi / ${taps}.0) * r;
        float th = fi * 2.39996 + ign * 6.2831;
        vec2 off = vec2(cos(th), sin(th)) * rr / uRes;
        vec3 s = texture2D(tDiffuse, vUv + off).rgb;
        float l = dot(s, vec3(0.2126, 0.7152, 0.0722));
        s *= min(1.0, 5.0 / max(l, 1e-4));                // keep sun glints from flooding the blur
        float w = 1.0 + smoothstep(0.9, 4.0, l) * 1.6;   // bright points become soft bokeh discs
        acc += s * w; wsum += w;
      }
      gl_FragColor = vec4(acc / wsum + bloom, 1.0);
    }`;
}
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uExposure: { value: 1 }, uWarm: { value: 0 }, uSat: { value: 1.1 }, uContrast: { value: 1.05 }, uVignette: { value: 0.32 }, uGrain: { value: 0.022 }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uNight: { value: 0 }, uFade: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uExposure, uWarm, uSat, uContrast, uVignette, uGrain, uTime, uNight, uFade; uniform vec2 uRes; varying vec2 vUv;

let composer, bloomPass, tiltPass, gradePass;
function buildPost() {
  const q = QUALITY[qualityName];
  const rt = new THREE.WebGLRenderTarget(innerWidth * q.pr, innerHeight * q.pr, { type: THREE.HalfFloatType, samples: q.samples });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(q.pr);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth * q.bloomScale, innerHeight * q.bloomScale), 0.6, 0.55, 0.92);
  composer.addPass(bloomPass);
  tiltPass = new ShaderPass({ ...TiltShiftShader, uniforms: THREE.UniformsUtils.clone(TiltShiftShader.uniforms), fragmentShader: tiltShader(q.taps) });

  tiltPass.uniforms.uRes.value.set(w, h);
  gradePass.uniforms.uRes.value.set(w, h);
  U.viewport.value.set(w, h);
  const pix = h / 1000;
  for (const m of [mist, embers, WAKE.mesh, fireflies, SPLASH.mesh].filter(Boolean)) if (m.material.uniforms.uPix) m.material.uniforms.uPix.value = h / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / 180;

}
function setQuality(name) {
  qualityName = name; store.set('quality', name);
  const q = QUALITY[name];
  renderer.setPixelRatio(q.pr);
  renderer.setSize(innerWidth, innerHeight, false);
  sunLight.shadow.mapSize.set(q.shadow, q.shadow);
  if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
  for (const p of [bloomPass, tiltPass, gradePass]) p.dispose();
  composer.dispose();
  buildPost();

//  Ambient sound — all synthesised with WebAudio (no files to load)
// =====================================================================
class Ambience {
  constructor() { this.ctx = null; this.enabled = false; this.volume = 0.7; }

    this.bus.birds.connect(this.verbIn); this.bus.chime.connect(this.verbIn);
    this.startOcean(); this.startWind(); this.startRain(); this.startCrickets(); this.startFire();

    w.f.frequency.cancelScheduledValues(t); w.f.frequency.setTargetAtTime(1300 + Math.random() * 900, t, rise / 3); w.f.frequency.setTargetAtTime(380, t + rise, 1.3);
    w.hg.gain.cancelScheduledValues(t); w.hg.gain.setTargetAtTime(0.06 + Math.random() * 0.05, t + rise * 0.85, 0.3); w.hg.gain.setTargetAtTime(0, t + rise + 1.0, 1.2);

  startFire() { this.loop(this.brown).connect(this.filt('lowpass', 260)).connect(this.gain(0.5)).connect(this.bus.fire); }
  tone(pts, dur, { type = 'sine', gain = 0.1, pan = 0, bus = 'birds', when = 0, attack = 0.01 } = {}) {

  updateGulls(dt, t, E.day * (1 - state.rainK * 0.7));
  updateMarine(dt, t);
  updateWake(dt);
  for (const c of CLOUDS) {
    c.ang += c.speed * dt * (1 + state.rainK);
    const rad = c.storm ? c.radStorm : lerp(c.rad, c.radStorm + 8, state.rainK * 0.7);
    c.mesh.position.set(Math.cos(c.ang) * rad, c.y - state.rainK * 3, Math.sin(c.ang) * rad);
    c.mesh.scale.setScalar(c.scale * (1 + state.rainK * 0.35) * (c.storm ? Math.max(0.001, state.rainK) : 1));
    c.mesh.visible = !c.storm || state.rainK > 0.02;
    // fade clouds that drift between the lens and the island
    const dc = c.mesh.position.distanceTo(camera.position);
    _v1.copy(c.mesh.position).project(camera);
    const inFront = Math.abs(_v1.x) < 0.75 && _v1.y > -0.7 && _v1.y < 0.55 && dc < camera.position.distanceTo(controls.target) + 4;
    c.fade = lerp(c.fade ?? 1, inFront ? 0 : 1, 1 - Math.exp(-dt * 2.5));
    c.mat.opacity = smooth(8, 22, dc) * c.fade;
    if (c.mat.opacity < 0.03) c.mesh.visible = false;
    c.mat.depthWrite = c.mat.opacity > 0.98;
  }
  if (lighthouseBeam) lighthouseBeam.rotation.y = t * 0.55;
  sky.position.copy(camera.position);

  // camera + post
  applyViewShift(dt);
  updateCamera(dt);
  const pr = QUALITY[qualityName].pr;
  tiltPass.uniforms.uFocus.value = focusY;
  const camDist = camera.position.distanceTo(controls.target);
  tiltPass.uniforms.uBand.value = clamp(lerp(0.42, 0.17, (camDist - 12) / 100), 0.17, 0.42);
  tiltPass.uniforms.uBlur.value = 11 * state.tilt * (innerHeight * pr / 1000);
  bloomPass.strength = E.bloom * state.bloom * 0.72;
  bloomPass.threshold = lerp(2.2, 0.85, E.night);
  const g = gradePass.uniforms;
  g.uExposure.value = E.exp; g.uWarm.value = E.warm; g.uSat.value = E.sat; g.uTime.value = t; g.uNight.value = E.night;
  g.uContrast.value = 1.08 - state.rainK * 0.05;
  composer.render(dt);

  // sound
  audio.update(dt, { day: E.day, dawn: smooth(5.4, 6.5, state.hour) * (1 - smooth(8, 9.5, state.hour)), night: smooth(0.5, 0.9, E.night), rain: state.rainK, fire: U.fire.value * smooth(0.2, 0.6, E.night), near: clamp(1 - (camDist - 20) / 170, 0, 1), wind: U.wind.value });

  // adaptive quality: step down once if the GPU is struggling
  if (started && t > 6) {
    state.fps.push(dt); if (state.fps.length > 150) state.fps.shift();
    if (state.fps.length === 150 && !state.downshifted) {
      const avg = state.fps.reduce((a, b) => a + b, 0) / 150;
      if (avg > 1 / 26 && qualityName !== 'low') { state.downshifted = true; const nq = qualityName === 'high' ? 'medium' : 'low'; document.querySelectorAll('#qualSeg button').forEach((x) => x.classList.toggle('active', x.dataset.q === nq)); setQuality(nq); movePill($('#qualSeg')); }
    }
  }
}

async function init() {
  fitFov();
  const steps = [
    ['正在铺沙滩…', () => buildTerrain()],
    ['堆起中央的岩石山…', () => buildMountain()],
    ['引来山泉和瀑布…', () => { buildHeightTexture(); buildWater(); buildStreamAndFalls(); }],
    ['打磨胡桃木底座…', () => { buildBase(); buildSkyAndLights(); }],
    ['搭建高脚屋和码头…', () => { A = buildStructures(); }],
    ['种下椰子树…', () => { buildPalms(); buildVegetation(); buildClouds(); }],
    ['请岛民们出门散步…', () => { buildBoats(A); EXTRA = buildPeople(A); buildGulls(); fireflies = buildFireflies(); buildRain(); buildWake(); }],
    ['海里的居民也游过来了…', () => buildMarine()],
    ['调好今天的光线…', () => {
      controls = new OrbitControls(camera, canvas);
      Object.assign(controls, { enableDamping: true, dampingFactor: 0.06, minDistance: 12, maxDistance: 300, maxPolarAngle: 1.36, minPolarAngle: 0.1, rotateSpeed: 0.55, zoomSpeed: 0.8, panSpeed: 0.6, autoRotateSpeed: 0.3 });
      const home = homeView();
      controls.target.copy(home.target);
      camera.position.copy(sph(home.target, 340, 0.62, -0.5));
      camera.lookAt(home.target);
      buildTour(A);
      buildPost();
      setupUI();
      sampleEnv(state.hour, 0); applyEnv(ENV, 0);
    }],
  ];
  for (let i = 0; i < steps.length; i++) {
    $('#loaderText').textContent = steps[i][0];
    $('#loaderBar').style.width = `${(i / steps.length) * 100}%`;
    await nextFrame(); await nextFrame();
    steps[i][1]();
  }
  $('#loaderBar').style.width = '100%';
  renderer.compile(scene, camera);
  addEventListener('resize', onResize);
  window.__islandReady = true;
  clearTimeout(window.__islandBoot);
  frame();
  started = true;
  const home = homeView();
  flyTo(home.pos, home.target, 4.5);
  setTimeout(() => $('#loader').classList.add('done'), 250);
}
init().catch((err) => {
  console.error(err);
  const e = $('#loaderErr'); e.hidden = false; e.textContent = '小岛没能搭起来：' + (err && err.message ? err.message : err);
});

// handy for tinkering from the browser console
window.__island = { MARINE, CLOUDS, state, stopTween() { camTween = null; }, finishTween() { if (camTween) camTween.t = 0.999; }, setCamMode, flyTo, camera, renderer, scene, get composer() { return composer; }, get passes() { return { bloomPass, tiltPass, gradePass }; }, get controls() { return controls; }, FOLLOWABLE, homeView, setQuality, sph };

</script>
